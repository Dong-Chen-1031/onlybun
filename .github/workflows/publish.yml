name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: node test/run.cjs

      # No NPM_TOKEN: auth comes from the OIDC token, and provenance is
      # attached automatically. Requires a trusted publisher configured at
      # npmjs.com -> package -> Settings, pointing at this workflow file.
      - run: npm publish
